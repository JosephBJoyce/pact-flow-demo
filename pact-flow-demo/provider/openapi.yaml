# Used only by the OPTIONAL bi-directional flow (scripts/publish-oas.sh).
openapi: 3.0.3
info: { title: product-service, version: 1.0.0 }
paths:
  /products:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Product' } }
  /products/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { description: Not found, content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties: { id: { type: integer }, name: { type: string }, price: { type: number } }
